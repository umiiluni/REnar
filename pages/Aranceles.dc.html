<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../assets/js/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="../assets/design-system/industry/styles.css">
  <script src="../assets/design-system/industry/_ds_bundle.js"></script>
  <title>miRenar — Aranceles</title>
</helmet>
<div style="background:var(--color-bg);min-height:100vh;display:flex;flex-direction:column">
  <dc-import name="Header" active="aranceles" hint-size="100%,116px"></dc-import>
  <div style="max-width:1280px;margin:0 auto;padding:16px 24px 0;font-size:13px;opacity:.6">
    <a href="Home.dc.html" style="color:var(--color-text);text-decoration:none" style-hover="text-decoration:underline">Inicio</a> / Recursos / Aranceles
  </div>
  <section style="max-width:1280px;margin:0 auto;padding:16px 24px 20px;width:100%">
    <h1 style="font-family:var(--font-heading);font-size:32px;font-weight:700;margin:0 0 4px">Aranceles</h1>
    <p style="font-size:14px;opacity:.65;margin:0 0 8px">Valores vigentes para los trámites de RENAR.</p>
    <p style="font-size:12px;opacity:.5;margin:0 0 24px">Valores de ejemplo — no representan aranceles reales.</p>

    <div style="position:relative;max-width:420px;margin-bottom:20px">
      <input class="input" type="text" placeholder="Buscar trámite..." value="{{ query }}" onChange="{{ onQuery }}" style="padding-left:34px" />
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.5"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
    </div>

    <div style="overflow-x:auto">
      <table class="table" style="width:100%;min-width:560px">
        <thead><tr><th>Trámite</th><th>Categoría</th><th>Arancel</th><th>Vigencia</th><th></th></tr></thead>
        <tbody>
          <sc-for list="{{ filtered }}" as="a" hint-placeholder-count="4">
            <tr>
              <td>{{ a.tramite }}</td>
              <td>{{ a.categoria }}</td>
              <td style="font-weight:600">{{ a.valor }}</td>
              <td>{{ a.vigencia }}</td>
              <td><a href="Tramites.dc.html" class="btn btn-ghost" style="padding:6px 8px;font-size:12px">Ver trámite</a></td>
            </tr>
          </sc-for>
        </tbody>
      </table>
    </div>
  </section>
  <div style="flex:1"></div>
  <dc-import name="Footer" hint-size="100%,220px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const ARANCELES = [
  { tramite: 'Solicitud de credencial', categoria: 'Credenciales', valor: '$ 12.500', vigencia: '2026' },
  { tramite: 'Renovación de credencial', categoria: 'Credenciales', valor: '$ 8.900', vigencia: '2026' },
  { tramite: 'Registro de arma de fuego', categoria: 'Armas', valor: '$ 21.300', vigencia: '2026' },
  { tramite: 'Habilitación de comercio', categoria: 'Comercios', valor: '$ 65.000', vigencia: '2026' },
];
class Component extends DCLogic {
  state = { query: '' };
  renderVals() {
    const q = this.state.query.trim().toLowerCase();
    return {
      query: this.state.query, onQuery: e => this.setState({ query: e.target.value }),
      filtered: ARANCELES.filter(a => !q || a.tramite.toLowerCase().includes(q) || a.categoria.toLowerCase().includes(q)),
    };
  }
}
</script>
</body>
</html>
